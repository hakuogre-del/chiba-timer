<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勝どきサーキットタイマー</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="../icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="勝どきタイマー"><style>body{background:#080c10;color:white;font:18px sans-serif;text-align:center;padding:15vh 1em}</style></head><body><p id="loading">タイマーと映像を読み込み中です。初回は少し時間がかかります…</p><script>(async()=>{try{const [app,media]=await Promise.all(['./app-template.txt','../index.html'].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error('HTTP '+r.status);return r.text()}));const intro=media.match(/<script id="introData" type="application\/json">"([A-Za-z0-9+/=]+)"<\/script>/),video=media.match(/const bin=atob\('([A-Za-z0-9+/=]+)'\)/);if(!intro||!video)throw Error('映像データなし');const html=app.replace('__PUBLIC_INTRO__',intro[1]).replace('__PUBLIC_VIDEO__',video[1]);document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='読み込めませんでした。初回はネット接続を確認して、再読み込みしてください。'}})()</script></body></html>
